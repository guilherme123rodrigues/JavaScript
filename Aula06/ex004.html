<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <script>
        var nome = window.prompt('Qual é seu nome? ')
        document.write(`Seu nome tem ${nome.length} letras`)
        document.write(`<br>Seu nome está em maiúsculo <strong>${nome.toUpperCase()}</strong>`)
        document.write(`<br>Seu nome está em minúsculo <strong>${nome.toLowerCase()}</strong>`)
    </script>
</body>
</html>
